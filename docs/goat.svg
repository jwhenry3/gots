<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#00ADD8"/>
  <!-- horns: large tapered points -->
  <path d="M90 76 C72 58 60 36 58 8 C74 30 94 50 110 62 Z" fill="#6B4F3B"/>
  <path d="M166 76 C184 58 196 36 198 8 C182 30 162 50 146 62 Z" fill="#6B4F3B"/>
  <!-- ears -->
  <ellipse cx="60" cy="122" rx="24" ry="13" transform="rotate(-28 60 122)" fill="#E3D5C0"/>
  <ellipse cx="196" cy="122" rx="24" ry="13" transform="rotate(28 196 122)" fill="#E3D5C0"/>
  <!-- inner ear contour -->
  <ellipse cx="62" cy="122" rx="13" ry="6" transform="rotate(-28 62 122)" fill="#D8C3A8"/>
  <ellipse cx="194" cy="122" rx="13" ry="6" transform="rotate(28 194 122)" fill="#D8C3A8"/>
  <!-- face -->
  <path d="M128 62 C162 62 186 96 186 136 C186 178 160 214 128 214 C96 214 70 178 70 136 C70 96 94 62 128 62 Z" fill="#FBF7EF"/>
  <!-- cheek shade contour -->
  <path d="M128 62 C162 62 186 96 186 136 C186 178 160 214 128 214 C164 206 176 170 172 132 C168 96 148 66 128 62 Z" fill="#F0E6D4"/>
  <!-- forelock -->
  <path d="M104 66 Q128 46 152 66 Q128 56 104 66 Z" fill="#E3D5C0"/>
  <!-- brow contour -->
  <path d="M92 112 Q106 104 120 110" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M136 110 Q150 104 164 112" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes: horizontal goat pupils -->
  <rect x="94" y="122" width="24" height="11" rx="5.5" fill="#263238"/>
  <rect x="138" y="122" width="24" height="11" rx="5.5" fill="#263238"/>
  <!-- snout: wide at the bridge, tapering to the chin -->
  <path d="M94 166 C94 150 110 142 128 142 C146 142 162 150 162 166 C162 186 146 204 128 206 C110 204 94 186 94 166 Z" fill="#E3D5C0"/>
  <!-- nostrils -->
  <circle cx="117" cy="178" r="4" fill="#263238"/>
  <circle cx="139" cy="178" r="4" fill="#263238"/>
  <!-- mouth line -->
  <path d="M119 196 Q128 202 137 196" stroke="#263238" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- rough spiky chin beard -->
  <path d="M112 201 Q128 206 144 203 L142 218 L140 234 L136 218 L132 240 L128 222 L124 242 L120 222 L116 236 L114 216 Z" fill="#E3D5C0"/>
</svg>
