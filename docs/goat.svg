<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#00ADD8"/>
  <!-- horns: large tapered points -->
  <path d="M92 10 Q128 40 120 68 L96 82 Q104 40 92 10 Z" fill="#6B4F3B" transform="rotate(-25 109 75)"/>
  <path d="M164 10 Q128 40 136 68 L160 82 Q152 40 164 10 Z" fill="#6B4F3B" transform="rotate(25 147 75)"/>
  <!-- rough spiky chin beard (under head layer) -->
  <path d="M112 201 Q128 206 144 203 L142 218 L140 234 L136 218 L132 240 L128 222 L124 242 L120 222 L116 236 L114 216 Z" fill="#E3D5C0"/>
  <!-- ears: long floppy, curving down like a horn -->
  <g transform="rotate(18 88 78)">
    <path d="M86 70 C62 76 44 96 40 122 C37 133 45 139 54 132 C68 120 80 100 92 82 Z" fill="#E3D5C0"/>
    <!-- inner ear contour -->
    <path d="M82 76 C66 82 54 96 52 114 C62 106 74 92 86 80 Z" fill="#D8C3A8"/>
  </g>
  <g transform="rotate(-18 168 78)">
    <path d="M170 70 C194 76 212 96 216 122 C219 133 211 139 202 132 C188 120 176 100 164 82 Z" fill="#E3D5C0"/>
    <path d="M174 76 C190 82 202 96 204 114 C194 106 182 92 170 80 Z" fill="#D8C3A8"/>
  </g>
  <!-- head: two overlapping ovals — broad cranium + narrow jaw -->
  <ellipse cx="128" cy="106" rx="54" ry="64" fill="#FBF7EF"/>
  <ellipse cx="128" cy="166" rx="30" ry="46" fill="#FBF7EF"/>
  <!-- cheek shade contour -->
  <path d="M128 42 C162 42 182 70 182 106 C182 142 160 170 128 170 C154 162 170 136 170 106 C170 76 152 50 128 42 Z" fill="#F0E6D4"/>
  <!-- forelock -->
  <path d="M104 66 Q128 46 152 66 Q128 56 104 66 Z" fill="#E3D5C0"/>
  <!-- brow contour -->
  <path d="M88 92 Q100 84 114 90" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M142 90 Q156 84 168 92" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="100" cy="106" r="11" fill="#263238"/>
  <circle cx="156" cy="106" r="11" fill="#263238"/>
  <!-- snout: small tint hugging the chin edge -->
  <path d="M104 176 C104 162 115 156 128 156 C141 156 152 162 152 176 C152 192 141 206 128 208 C115 206 104 192 104 176 Z" fill="#E3D5C0"/>
  <!-- flared nostrils -->
  <ellipse cx="115" cy="187" rx="7" ry="4" transform="rotate(-28 115 187)" fill="#263238"/>
  <ellipse cx="141" cy="187" rx="7" ry="4" transform="rotate(28 141 187)" fill="#263238"/>
  <!-- cleft lip -->
  <path d="M128 190 L128 199 L121 204 M128 199 L135 204" stroke="#263238" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
