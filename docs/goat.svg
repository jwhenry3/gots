<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="48" fill="#00ADD8"/>
  <!-- horns: large tapered points -->
  <path d="M92 74 C76 52 78 26 56 10 C66 32 96 52 112 62 Z" fill="#6B4F3B"/>
  <path d="M164 74 C180 52 178 26 200 10 C190 32 160 52 144 62 Z" fill="#6B4F3B"/>
  <!-- rough spiky chin beard (under head layer) -->
  <path d="M112 201 Q128 206 144 203 L142 218 L140 234 L136 218 L132 240 L128 222 L124 242 L120 222 L116 236 L114 216 Z" fill="#E3D5C0"/>
  <!-- ears: long floppy, curving down like a horn -->
  <path d="M86 102 C62 108 44 128 40 154 C37 165 45 171 54 164 C68 152 80 132 92 114 Z" fill="#E3D5C0"/>
  <path d="M170 102 C194 108 212 128 216 154 C219 165 211 171 202 164 C188 152 176 132 164 114 Z" fill="#E3D5C0"/>
  <!-- inner ear contour -->
  <path d="M82 108 C66 114 54 128 52 146 C62 138 74 124 86 112 Z" fill="#D8C3A8"/>
  <path d="M174 108 C190 114 202 128 204 146 C194 138 182 124 170 112 Z" fill="#D8C3A8"/>
  <!-- head: two overlapping ovals — broad cranium + narrow jaw -->
  <ellipse cx="128" cy="106" rx="58" ry="60" fill="#FBF7EF"/>
  <ellipse cx="128" cy="166" rx="40" ry="46" fill="#FBF7EF"/>
  <!-- cheek shade contour -->
  <path d="M128 56 C164 56 186 80 186 108 C186 136 162 156 128 156 C156 148 172 128 172 104 C172 76 152 56 128 56 Z" fill="#F0E6D4"/>
  <!-- forelock -->
  <path d="M104 66 Q128 46 152 66 Q128 56 104 66 Z" fill="#E3D5C0"/>
  <!-- brow contour -->
  <path d="M92 112 Q106 104 120 110" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M136 110 Q150 104 164 112" stroke="#D8C3A8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="106" cy="127" r="11" fill="#263238"/>
  <circle cx="150" cy="127" r="11" fill="#263238"/>
  <!-- snout: small tint hugging the chin edge -->
  <path d="M104 176 C104 162 115 156 128 156 C141 156 152 162 152 176 C152 192 141 206 128 208 C115 206 104 192 104 176 Z" fill="#E3D5C0"/>
  <!-- flared nostrils -->
  <ellipse cx="115" cy="187" rx="7" ry="4" transform="rotate(-28 115 187)" fill="#263238"/>
  <ellipse cx="141" cy="187" rx="7" ry="4" transform="rotate(28 141 187)" fill="#263238"/>
  <!-- cleft lip -->
  <path d="M128 190 L128 199 L121 204 M128 199 L135 204" stroke="#263238" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
